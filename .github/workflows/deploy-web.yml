name: Deploy web app to Vercel

# Production deploy of the React web app (frontend/) on every push to main that touches it.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN           - https://vercel.com/account/tokens
#   VERCEL_ORG_ID          - "orgId" from .vercel/project.json after `vercel link` in the repo root
#   VERCEL_WEB_PROJECT_ID  - "projectId" of the web project (Root Directory = frontend)
# VITE_API_URL is read from the Vercel project's Environment Variables (frontend/.env.production is not in git).
# The build runs on Vercel, not here: `vercel pull` cannot read variables marked "Sensitive" and writes the
# placeholder "[SENSITIVE]" instead, which a local `vercel build` would bake into the bundle as the API URL.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Vercel (production)
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Run from the repo root: the project's Root Directory (frontend) comes from its Vercel settings.
      # Uploads the sources; Vercel builds them with the project's production Environment Variables.
      - name: Build and deploy on Vercel
        id: deploy
        run: echo "url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
