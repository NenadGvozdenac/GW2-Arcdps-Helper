name: Build uploader

# Builds the desktop uploader (Windows installer + portable exe).
# - Push to main that touches uploader/ (or a manual run): the .exe files are attached to the run as an artifact.
# - Release, either way:
#   - Actions → Build uploader → Run workflow with "release" ticked (version optional, empty = next patch), or
#   - push a tag like `uploader-v0.2.0` (`make release-uploader` does that).
#   The app gets that version and the .exe files + latest.yml are published as a GitHub Release.
#   Both use scripts/release.mjs to pick the version and create the tag.
# Production URLs are baked in at build time. Optional repository variables (Settings -> Secrets and variables ->
# Actions -> Variables) UPLOADER_API_URL and UPLOADER_WEB_URL override the defaults below.

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every uploader-v* tag builds.
    tags: ["uploader-v*"]
    paths:
      - "uploader/**"
      - ".github/workflows/build-uploader.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (creates the uploader-vX.Y.Z tag)"
        type: boolean
        default: false
      version:
        description: "Version X.Y.Z (empty = next patch version)"
        type: string
        required: false

concurrency:
  group: build-uploader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: uploader
    env:
      # No code-signing certificate: don't let electron-builder look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uploader/package-lock.json

      - name: Create the release tag
        id: tag
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs uploader "$VERSION"

      - name: Resolve the release (tag push or "release" run)
        id: release
        env:
          CREATED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/uploader-v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [[ -n "$CREATED_TAG" ]]; then TAG="$CREATED_TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#uploader-v}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG:-none (artifact only)}"

      - run: npm ci

      - name: Write production URLs (.env.production is not in git)
        run: |
          cat > .env.production <<EOF
          MAIN_VITE_API_URL=${{ vars.UPLOADER_API_URL || 'https://gw2-arcdps-helper-api.vercel.app/api' }}
          MAIN_VITE_WEB_URL=${{ vars.UPLOADER_WEB_URL || 'https://gw2-arcdps-helper.vercel.app' }}
          EOF
          cat .env.production

      - name: Take the version from the release
        if: steps.release.outputs.tag != ''
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Typecheck, build and package
        run: npm run build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: gw2-arcdps-helper-uploader
          path: |
            uploader/dist/*.exe
            uploader/dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Uploader ${{ steps.release.outputs.tag }}
          # latest.yml (+ blockmap) is what the installed app's auto-updater reads.
          files: |
            uploader/dist/*.exe
            uploader/dist/*.blockmap
            uploader/dist/latest.yml
          generate_release_notes: true

      # The website's download button links here: a fixed URL that always serves the newest installer, so it works
      # without asking the GitHub API (rate-limited per visitor) which release is the newest.
      - name: Update the stable download (release uploader-latest)
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p stable
          cp dist/GW2-ArcDPS-Helper-Uploader-Setup-*.exe stable/GW2-ArcDPS-Helper-Uploader-Setup.exe
          cp dist/GW2-ArcDPS-Helper-Uploader-Portable-*.exe stable/GW2-ArcDPS-Helper-Uploader-Portable.exe
          NOTES="Always the newest desktop uploader (currently $TAG). Versioned releases are tagged uploader-vX.Y.Z."
          gh release view uploader-latest > /dev/null 2>&1 ||
            gh release create uploader-latest --title "Uploader - latest download" --notes "$NOTES" --latest=false
          gh release upload uploader-latest stable/* --clobber
          gh release edit uploader-latest --notes "$NOTES" --latest=false
